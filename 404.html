<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:#122240;color:#fff;font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.55;padding:32px 16px;text-align:center}
.box{width:100%;max-width:520px}
.brand{display:inline-flex;align-items:center;gap:12px;text-decoration:none;color:#fff;text-align:left}
.brand svg{width:52px;height:52px;flex:none;border-radius:10px;box-shadow:0 0 0 1px rgba(255,255,255,.18)}
.brand b{display:block;font-family:"Montserrat","Helvetica Neue",Arial,sans-serif;font-weight:800;font-size:24px;letter-spacing:-.01em;line-height:1;white-space:nowrap}
.brand b span{color:#F0A500}
.brand small{display:block;font-size:13px;font-weight:600;color:#C7D0DE;margin-top:6px;white-space:nowrap}
h1{font-family:"Montserrat","Helvetica Neue",Arial,sans-serif;font-weight:800;font-size:clamp(28px,7vw,40px);letter-spacing:-.02em;line-height:1.15;margin:32px 0 10px}
p{margin:0 auto 26px;max-width:42ch;color:#C7D0DE;font-size:16px}
p b{color:#fff}
.cta{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:50px;padding:13px 20px;border-radius:10px;border:1.5px solid transparent;font-weight:700;font-size:16px;line-height:1.2;text-decoration:none;max-width:100%}
.btn svg{width:20px;height:20px;flex:none}
.call{background:#F0A500;border-color:#F0A500;color:#161200}
.call:hover{background:#D99400;border-color:#D99400}
.home{background:transparent;color:#fff;border-color:rgba(255,255,255,.45)}
.home:hover{border-color:#fff;background:rgba(255,255,255,.06)}
a:focus-visible{outline:3px solid #F0A500;outline-offset:3px}
.fine{margin:22px 0 0;font-size:13px;color:#9AA8BC}
@media (max-width:400px){.cta .btn{width:100%}}
</style>
</head>
<body>
<main class="box">
  <a class="brand" id="logo" href="/" aria-label="ODŤAH 365, úvodná stránka">
    <svg viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="10" fill="#122240"/><g fill="none" stroke="#F0A500" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18C6 15.6 8 14.5 10.2 14.5C12.8 14.5 14.5 16 14.5 18.3C14.5 20.5 12.8 22 10.2 22C13 22 15 23.6 15 26.3C15 29 12.8 30.8 10.2 30.8C7.7 30.8 5.7 29.6 5.4 27.4"/><path d="M28.4 16C27 14.9 25.6 14.5 24.2 14.5C20.8 14.5 19.2 17.5 19.2 22.6C19.2 27.8 21 30.8 24.2 30.8C27 30.8 28.9 28.8 28.9 26.1C28.9 23.3 27 21.5 24.4 21.5C22 21.5 19.8 23 19.4 25.2"/><path d="M42.6 14.8H34.8L34 22.3C35.2 21.5 36.5 21.1 37.9 21.1C40.9 21.1 43 23.2 43 26C43 28.9 40.9 30.8 37.9 30.8C35.7 30.8 34.1 29.9 33.4 28.4"/></g><path d="M8 37H40" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>
    <span><b>ODŤAH <span>365</span></b><small>každý deň 8–22</small></span>
  </a>
  <h1>Stránka sa nenašla</h1>
  <p>Adresa, ktorú ste otvorili, neexistuje. Odťah auta <b>od 65 €</b> objednáte telefonicky alebo na úvodnej stránke.</p>
  <div class="cta">
    <a class="btn call" href="tel:+421900000000"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6.2 6.2l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>Zavolať 0900 000 000</a>
    <a class="btn home" id="home" href="/">Na úvodnú stránku</a>
  </div>
  <p class="fine">Dispečing každý deň 8:00 – 22:00 · Bratislava a okolie rýchlo, prevozy po celom Slovensku</p>
</main>
<script>
(function(){
  /* Na GitHub Pages (meno.github.io/repozitar/) vedie domov do priečinka repozitára, inak na koreň domény. */
  var home = '/';
  try {
    var seg = location.pathname.split('/')[1];
    if (/\.github\.io$/i.test(location.hostname) && seg) home = '/' + seg + '/';
  } catch (e) {}
  document.getElementById('home').href = home;
  document.getElementById('logo').href = home;
})();
</script>
</body>
</html>
